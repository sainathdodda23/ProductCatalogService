spring.application.name=ProductCatalogService

# 1. Database Connection URL (Points to your local machine and database name)
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/ecommerce_staging?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 2. Database Credentials (Hardcoded for initial testing)
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

groq.api-key=${GROQ_API_KEY}

# 3. Hibernate and JPA Settings (Controls database tables and logs)
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
